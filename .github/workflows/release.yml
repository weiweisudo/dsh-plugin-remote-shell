name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: agent/go.sum

      - name: Build agents
        working-directory: agent
        run: |
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/remote-agent-linux-amd64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-H windowsgui -s -w" -o ../dist/remote-agent-windows-amd64.exe .

      - name: Checksums
        working-directory: dist
        run: sha256sum remote-agent-linux-amd64 remote-agent-windows-amd64.exe > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/remote-agent-linux-amd64
            dist/remote-agent-windows-amd64.exe
            dist/SHA256SUMS
          generate_release_notes: true
